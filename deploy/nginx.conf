# /etc/nginx/sites-available/plenka  (потом: ln -s ... sites-enabled/, certbot --nginx -d plenka-pics.ru -d www.plenka-pics.ru)
server {
    listen 80;
    server_name plenka-pics.ru www.plenka-pics.ru;

    client_max_body_size 210m;          # больше не примет: защита от забивания диска
    client_body_timeout 300s;

    # Файлы фото и видео. internal = снаружи по этому адресу ничего не открыть,
    # nginx отдаёт файл только когда Django разрешил (X-Accel-Redirect)
    location /_protected/ {
        internal;
        alias /srv/photohost/media/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "private, max-age=300";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;              # настоящий IP посетителя
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering on;
    }
}
